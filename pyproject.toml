[project]
name = "quakecast"
version = "0.1.0"
description = "Prospective earthquake and aftershock forecasting, scored with CSEP tests."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pycsep>=0.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pyarrow>=15",
    "statsmodels>=0.14",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
]

[project.scripts]
quakecast = "quakecast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quakecast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Markdown tables and prose in the notebook builder.
"scripts/build_eda_notebook.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
